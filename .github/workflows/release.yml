name: Publish releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-publishing
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      name: ${{ steps.package.outputs.name }}
      changelog: ${{ steps.package.outputs.changelog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate release identity
        id: identity
        run: python tools/release.py identity
      - name: Require source on main branch
        env:
          MAIN_BRANCH: ${{ steps.identity.outputs.main_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$MAIN_BRANCH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/build_wayfarer_packs.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/release.py verify
      - name: Record verified archive
        id: package
        run: python tools/release.py metadata
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/WayfarerPacks-*.zip
            dist/WayfarerPacks-*.manifest.json
            dist/WayfarerPacks-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
  github-release:
    needs: build
    if: vars.RELEASES_ENABLED == 'true' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
        run: python tools/release.py publish
  nexus:
    needs: [build, github-release]
    if: vars.NEXUSMODS_ENABLED == 'true' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: nexus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Verify artifact and Nexus configuration
        env:
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUSMODS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: python tools/release.py nexus
      - name: Upload unchanged archive
        id: upload
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: dist/${{ needs.build.outputs.filename }}
          version: ${{ needs.build.outputs.version }}
          changelog: ${{ needs.build.outputs.changelog }}
          display_name: ${{ needs.build.outputs.name }} ${{ needs.build.outputs.version }}
          category: main
          archive_existing_version: 'false'
          primary_mod_manager_download: 'false'
          allow_mod_manager_download: 'true'
          show_requirements_pop_up: 'true'
          update_mod_version: 'true'
      - name: Record Nexus result
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          printf 'Nexus version ID: %s\n' "$VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
